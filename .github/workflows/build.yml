name: Build FFmpeg 8.1 Tiny Rocket
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential pkg-config yasm nasm xz-utils

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Download FFmpeg 8.1 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-8.1.tar.xz
        tar -xf ffmpeg-8.1.tar.xz

    - name: Compile Tiny FFmpeg 8.1 (16KB Aligned)
      run: |
        cd ffmpeg-8.1
        export NDK=$ANDROID_NDK_HOME
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export API=24
        export ARCH=aarch64
        
        CC=$TOOLCHAIN/bin/${ARCH}-linux-android${API}-clang
        CXX=$TOOLCHAIN/bin/${ARCH}-linux-android${API}-clang++
        STRIP=$TOOLCHAIN/bin/llvm-strip

        # 🔥 FFMPEG 8.1 FIXED CONFIG (Removed deprecated postproc)
        ./configure \
            --target-os=android \
            --arch=$ARCH \
            --cpu=armv8-a \
            --cc=$CC \
            --cxx=$CXX \
            --cross-prefix=$TOOLCHAIN/bin/llvm- \
            --enable-cross-compile \
            --enable-shared \
            --disable-static \
            --enable-small \
            --disable-debug \
            --disable-runtime-cpudetect \
            --extra-cflags="-Os -fPIC" \
            --extra-ldflags="-z max-page-size=16384" \
            --disable-everything \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avfilter \
            --disable-network \
            --disable-encoders \
            --enable-swresample \
            --enable-swscale \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-protocol=file,pipe \
            --enable-demuxer=mov,mp4,m4a,3gp,3g2,mj2,matroska,webm,mp3,aac,flac \
            --enable-muxer=mp4,mov,matroska,webm,mp3,adts \
            --enable-decoder=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mp3 \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,opus,vorbis \
            --enable-bsf=aac_adtstoasc

        make clean
        make -j$(nproc)

        # 🔥 Size Optimization: Stripping symbols for production
        $STRIP libavformat/libavformat.so
        $STRIP libavcodec/libavcodec.so
        $STRIP libavutil/libavutil.so
        $STRIP libswresample/libswresample.so
        $STRIP libswscale/libswscale.so

    - name: Prepare Artifacts
      run: |
        mkdir -p output_libs
        cp ffmpeg-8.1/libavformat/libavformat.so output_libs/
        cp ffmpeg-8.1/libavcodec/libavcodec.so output_libs/
        cp ffmpeg-8.1/libavutil/libavutil.so output_libs/
        cp ffmpeg-8.1/libswresample/libswresample.so output_libs/
        cp ffmpeg-8.1/libswscale/libswscale.so output_libs/

    - name: Upload Tiny FFmpeg 8.1
      uses: actions/upload-artifact@v4
      with:
        name: Tiny-FFmpeg-8.1-arm64
        path: output_libs/
