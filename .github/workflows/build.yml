name: Build Latest Tiny FFmpeg
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Download FFmpeg 7.1 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        tar -xf ffmpeg-7.1.tar.xz

    - name: Compile Ultra-Slim FFmpeg (16KB Page Aligned)
      run: |
        cd ffmpeg-7.1
        export NDK=$ANDROID_NDK_HOME
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export API=24
        export ARCH=aarch64
        CC=$TOOLCHAIN/bin/${ARCH}-linux-android${API}-clang
        CXX=$TOOLCHAIN/bin/${ARCH}-linux-android${API}-clang++
        STRIP=$TOOLCHAIN/bin/llvm-strip

        # 🔥 ROCKET FLAGS: 16KB Page size support + Size Optimization
        # Humne encoders disable kiye hain kyunke aap sirf Merge kar rahy ho.
        ./configure \
            --target-os=android \
            --arch=$ARCH \
            --cpu=armv8-a \
            --cc=$CC \
            --cxx=$CXX \
            --cross-prefix=$TOOLCHAIN/bin/llvm- \
            --enable-cross-compile \
            --enable-shared \
            --disable-static \
            --enable-small \
            --extra-cflags="-Os -fPIC" \
            --extra-ldflags="-z max-page-size=16384" \
            --disable-everything \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-swresample \
            --disable-swscale \
            --disable-postproc \
            --disable-avfilter \
            --disable-network \
            --disable-encoders \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-protocol=file,pipe \
            --enable-demuxer=mov,mp4,m4a,3gp,3g2,mj2,matroska,webm,mp3,aac,flac \
            --enable-muxer=mp4,mov,matroska,webm,mp3,adts \
            --enable-decoder=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mp3 \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,opus,vorbis \
            --enable-bsf=aac_adtstoasc

        make clean
        make -j$(nproc)

        # 🔥 STRIP SYMBOLS: Debug data nikal kar size mazeed chota kar do
        $STRIP libavformat/libavformat.so
        $STRIP libavcodec/libavcodec.so
        $STRIP libavutil/libavutil.so

    - name: Prepare Artifacts
      run: |
        mkdir -p output_libs
        cp ffmpeg-7.1/libavformat/libavformat.so output_libs/
        cp ffmpeg-7.1/libavcodec/libavcodec.so output_libs/
        cp ffmpeg-7.1/libavutil/libavutil.so output_libs/

    - name: Upload Tiny .so Files
      uses: actions/upload-artifact@v4
      with:
        name: Latest-Tiny-FFmpeg-arm64
        path: output_libs/
