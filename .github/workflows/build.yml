name: Build Tiny FFmpeg
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Download FFmpeg 6.0 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz
        tar -xf ffmpeg-6.0.tar.xz

    - name: Compile Tiny FFmpeg (All-in-One Fix)
      run: |
        cd ffmpeg-6.0
        export NDK=$ANDROID_NDK_HOME
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export API=24
        export ARCH=aarch64
        export CPU=armv8-a
        export CC=$TOOLCHAIN/bin/${ARCH}-linux-android${API}-clang
        export CXX=$TOOLCHAIN/bin/${ARCH}-linux-android${API}-clang++
        export SYSROOT=$TOOLCHAIN/sysroot
        export CROSS_PREFIX=$TOOLCHAIN/bin/llvm-

        # 🔥 FIXED CONFIG: Merging ke liye jo libraries chahiye sab enable hain
        ./configure \
            --target-os=android \
            --arch=$ARCH \
            --cpu=$CPU \
            --cc=$CC \
            --cxx=$CXX \
            --sysroot=$SYSROOT \
            --cross-prefix=$CROSS_PREFIX \
            --enable-cross-compile \
            --enable-shared \
            --disable-static \
            --enable-small \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --enable-swresample \
            --enable-swscale \
            --disable-postproc \
            --disable-avfilter \
            --disable-network \
            --disable-everything \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-protocol=file,pipe \
            --enable-demuxer=mov,mp4,m4a,3gp,3g2,mj2,matroska,webm,mp3,aac,flac \
            --enable-muxer=mp4,mov,matroska,webm,mp3,adts \
            --enable-decoder=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mp3 \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,opus,vorbis \
            --enable-bsf=aac_adtstoasc

        make clean
        make -j$(nproc)

    - name: Prepare Artifacts Folder
      run: |
        mkdir -p output_libs
        cp ffmpeg-6.0/libavformat/libavformat.so output_libs/
        cp ffmpeg-6.0/libavcodec/libavcodec.so output_libs/
        cp ffmpeg-6.0/libavutil/libavutil.so output_libs/
        cp ffmpeg-6.0/libswresample/libswresample.so output_libs/
        cp ffmpeg-6.0/libswscale/libswscale.so output_libs/

    - name: Upload Tiny .so Files
      uses: actions/upload-artifact@v4
      with:
        name: Tiny-FFmpeg-Android-arm64
        path: output_libs/
