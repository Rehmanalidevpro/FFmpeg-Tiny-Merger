name: Build FFmpeg Mobile (32-bit & 64-bit)
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential pkg-config yasm nasm xz-utils

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Download FFmpeg 8.1 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-8.1.tar.xz
        tar -xf ffmpeg-8.1.tar.xz

    - name: Compile Tiny FFmpeg 8.1 (16KB Aligned) for Both Architectures
      run: |
        cd ffmpeg-8.1
        export NDK=$ANDROID_NDK_HOME
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export API=24
        
        # Ek main folder banayenge dono versions ke liye
        mkdir -p ../output_libs

        # Dono architecture ke liye bari bari compile hoga
        for ABI in "arm64-v8a" "armeabi-v7a"; do
          echo "🔥 Building for $ABI 🔥"
          
          # Pichli compilation ko saaf karna zaroori hai
          make clean || true

          # 🔥 ERROR FIXED HERE: if aur [ ke darmiyan space de di gayi hai 🔥
          if[ "$ABI" = "arm64-v8a" ]; then
            export ARCH=aarch64
            export CPU=armv8-a
            CC=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang
            CXX=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++
          else
            export ARCH=arm
            export CPU=armv7-a
            CC=$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang
            CXX=$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang++
          fi

          STRIP=$TOOLCHAIN/bin/llvm-strip

          # AAPKI ORIGINAL CONFIGURATION (Koi changing nahi ki)
          ./configure \
              --target-os=android \
              --arch=$ARCH \
              --cpu=$CPU \
              --cc=$CC \
              --cxx=$CXX \
              --cross-prefix=$TOOLCHAIN/bin/llvm- \
              --enable-cross-compile \
              --enable-shared \
              --disable-static \
              --enable-small \
              --disable-debug \
              --disable-runtime-cpudetect \
              --extra-cflags="-Os -fPIC" \
              --extra-ldflags="-z max-page-size=16384" \
              --disable-everything \
              --disable-programs \
              --disable-doc \
              --disable-avdevice \
              --disable-avfilter \
              --disable-network \
              --disable-encoders \
              --enable-swresample \
              --enable-swscale \
              --enable-avformat \
              --enable-avcodec \
              --enable-avutil \
              --enable-protocol=file,pipe \
              --enable-demuxer=mov,mp4,m4a,3gp,3g2,mj2,matroska,webm,mp3,aac,flac \
              --enable-muxer=mp4,mov,matroska,webm,mp3,adts \
              --enable-decoder=h264,hevc,vp8,vp9,av1,aac,opus,vorbis,mp3 \
              --enable-parser=h264,hevc,vp8,vp9,av1,aac,opus,vorbis \
              --enable-bsf=aac_adtstoasc

          make -j$(nproc)

          # 🔥 Size Optimization: Stripping symbols for production (Aapki original approach)
          $STRIP libavformat/libavformat.so
          $STRIP libavcodec/libavcodec.so
          $STRIP libavutil/libavutil.so
          $STRIP libswresample/libswresample.so
          $STRIP libswscale/libswscale.so

          # Copy libraries into their respective folders
          mkdir -p ../output_libs/$ABI
          cp libavformat/libavformat.so ../output_libs/$ABI/
          cp libavcodec/libavcodec.so ../output_libs/$ABI/
          cp libavutil/libavutil.so ../output_libs/$ABI/
          cp libswresample/libswresample.so ../output_libs/$ABI/
          cp libswscale/libswscale.so ../output_libs/$ABI/
          
        done

    - name: Upload Tiny FFmpeg 8.1 (All Devices)
      uses: actions/upload-artifact@v4
      with:
        name: Tiny-FFmpeg-8.1-Mobile
        path: output_libs/
